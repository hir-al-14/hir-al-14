name: Monthly Commits Graph

on:
  schedule:
    - cron: "0 3 1 * *"   # runs on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests matplotlib

      - name: Generate graph
        run: python monthly_commits.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: hir-al-14

      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/monthly-commits.svg
          git diff --staged --quiet || git commit -m "update monthly commits graph"
          git pull --rebase origin main
          git push